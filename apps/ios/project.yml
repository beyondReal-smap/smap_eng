name: HaruBook
options:
  bundleIdPrefix: site.smap.harubook
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""

targets:
  HaruBook:
    type: application
    platform: iOS
    sources:
      - path: HaruBook
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.smap.harubook.ios
        PRODUCT_NAME: HaruBook
        INFOPLIST_FILE: HaruBook/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: HaruBook/Info.plist
      properties:
        CFBundleDisplayName: 하루책
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        # URL scheme은 백엔드 parseMobileRedirect (smapeng: 만 허용)와 동기화 유지.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: site.smap.harubook.ios.auth
            CFBundleURLSchemes:
              - smapeng
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education

  HaruBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HaruBookTests
    dependencies:
      - target: HaruBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.smap.harubook.ios.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HaruBook.app/HaruBook
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HaruBook:
    build:
      targets:
        HaruBook: all
        HaruBookTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HaruBookTests
    archive:
      config: Release
