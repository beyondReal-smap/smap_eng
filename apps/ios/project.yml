name: HaruBook
options:
  bundleIdPrefix: com.smap.harubook
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
  groupSortPosition: top

# Firebase Cloud Messaging — APNs 직접 통신 대신 FCM 으로 통일.
# 같은 Firebase 프로젝트(`harubook-fb4af`)를 iOS·Android 가 공유하므로 백엔드도 단일 FCM 모듈로
# 발송한다(src/lib/push/fcm.ts). FirebaseMessaging 만 의존 — Analytics 등 다른 모듈은 미사용.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ZVXXRV5MTP

packages:
  # Firebase iOS SDK — FCM 토큰 발급에 FirebaseMessaging만 사용.
  # FirebaseCore는 product가 아니라 라이브러리이므로 명시 안 해도 transitively 따라온다.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  HaruBook:
    type: application
    platform: iOS
    sources:
      - path: HaruBook
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smap.harubook
        PRODUCT_NAME: HaruBook
        INFOPLIST_FILE: HaruBook/Info.plist
        CODE_SIGN_ENTITLEMENTS: HaruBook/HaruBook.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: HaruBook/Info.plist
      properties:
        CFBundleDisplayName: 하루책
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 시스템 launch screen — 배경색만 cream(#FFF7E8). UIImageName으로 로고를 넣으면
        # 디바이스마다 크기/잘림이 제각각이라 빼고, SwiftUI SplashView가 로드 직후
        # 즉시 진입해 로고/텍스트를 그린다.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        # URL scheme은 백엔드 parseMobileRedirect (smapeng: 만 허용)와 동기화 유지.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.smap.harubook.auth
            CFBundleURLSchemes:
              - smapeng
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
        # FCM 메시지를 백그라운드/서스펜드 상태에서 받기 위해 remote-notification 모드 활성화.
        UIBackgroundModes:
          - remote-notification
        # 웹 랜딩/메인과 동일한 손글씨 폰트(A2Z). 9 웨이트 중 핵심 3개만 번들.
        UIAppFonts:
          - AtoZ-4Regular.ttf
          - AtoZ-7Bold.ttf
          - AtoZ-9Black.ttf
        LSApplicationCategoryType: public.app-category.education

  HaruBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HaruBookTests
    dependencies:
      - target: HaruBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smap.harubook.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HaruBook.app/HaruBook
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HaruBook:
    build:
      targets:
        HaruBook: all
        HaruBookTests: [test]
    run:
      config: Debug
      # 시뮬레이터에서 App Store Connect 등록 상품 대신 로컬 .storekit 파일을 사용해 결제 흐름 테스트.
      # 이 파일 미연결 시 Product.products(for:)가 빈 배열을 반환해 StoreView에 "아직 상품이 없어요"가 뜬다.
      storeKitConfiguration: HaruBook.storekit
    test:
      config: Debug
      targets:
        - HaruBookTests
    archive:
      config: Release
